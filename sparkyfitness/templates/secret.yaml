apiVersion: v1
kind: Secret
metadata:
  name: sparkyfitness-app
  namespace: '{{ .Release.Namespace }}'
  annotations:
    # Keep the generated keys across uninstall so a reinstall can still decrypt
    # data encrypted with the original key. To rotate on purpose, delete this
    # Secret and upgrade — the else branch mints fresh values.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Owned by Olares middleware (generated by the platform, never baked into the chart).
  SPARKY_FITNESS_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  # Upstream wants a separate restricted app role; with system middleware there is
  # one injected role, so both credentials are the same platform-managed secret.
  SPARKY_FITNESS_APP_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  # Generated per install (see _helpers.tpl).
  SPARKY_FITNESS_API_ENCRYPTION_KEY: {{ include "sparkyfitness.apiEncryptionKey" . | quote }}
  BETTER_AUTH_SECRET: {{ include "sparkyfitness.betterAuthSecret" . | quote }}
  # Optional — empty unless the owner filled SMTP settings in Olares Settings.
  SPARKY_FITNESS_EMAIL_PASS: {{ .Values.olaresEnv.SMTP_PASSWORD | quote }}
